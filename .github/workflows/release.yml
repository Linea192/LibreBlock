name: Build & Release IPA

# Builds LibreBlock and publishes an installable .ipa
#
#  - Push a tag like v1.0.0  -> builds + creates a GitHub Release with the IPA attached
#  - "Run workflow" (manual) -> builds + uploads the IPA as a workflow artifact
#
# Optional: add signing secrets to sign the IPA (Apple Developer account required).
# Without secrets, an UNSIGNED ipa is produced - install it by re-signing with a
# tool like Sideloadly/AltStore, or your own certificate.
#
# Required secrets for signed builds:
#   P12_CERTIFICATE              base64-encoded .p12 distribution certificate
#   P12_PASSWORD                 password of the .p12
#   PROVISIONING_PROFILE         base64-encoded .mobileprovision (Ad Hoc or App Store)
#   TEAM_ID                      e.g. ABCDE12345
# Optional secrets:
#   PROVISIONING_PROFILE_SPECIFIER  name of the provisioning profile
#   CODE_SIGN_IDENTITY           default "Apple Distribution"
#   EXPORT_METHOD                default "ad-hoc" (or app-store)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Detect signing secrets
        id: signing
        env:
          HAS_CERT: ${{ secrets.P12_CERTIFICATE != '' }}
          HAS_PROFILE: ${{ secrets.PROVISIONING_PROFILE != '' }}
        run: |
          if [ "$HAS_CERT" = "true" ] && [ "$HAS_PROFILE" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing: certificate + provisioning profile found -> signed IPA"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing: no secrets found -> unsigned IPA (re-sign to install)"
          fi

      # ------------------------- signed build path -------------------------

      - name: Import signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          P12_CERTIFICATE: ${{ secrets.P12_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          echo "$P12_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed 's/"//g')

      - name: Install provisioning profile
        if: steps.signing.outputs.enabled == 'true'
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          echo "$PROVISIONING_PROFILE" | base64 --decode > profile.mobileprovision
          UUID=$(security cms -D -i profile.mobileprovision | plutil -extract UUID raw -)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision

      - name: Build archive (signed)
        if: steps.signing.outputs.enabled == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY || 'Apple Distribution' }}
          PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER || '' }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '1.0.0' }}
        run: |
          SPECIFIER_ARGS=()
          if [ -n "$PROFILE_SPECIFIER" ]; then
            SPECIFIER_ARGS=(PROVISIONING_PROFILE_SPECIFIER="$PROFILE_SPECIFIER")
          fi
          xcodebuild archive \
            -project LibreBlock.xcodeproj \
            -scheme LibreBlock \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/LibreBlock.xcarchive \
            MARKETING_VERSION="${VERSION#v}" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            "${SPECIFIER_ARGS[@]}"

      - name: Export IPA (signed)
        if: steps.signing.outputs.enabled == 'true'
        env:
          EXPORT_METHOD: ${{ secrets.EXPORT_METHOD || 'ad-hoc' }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          VERSION_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>method</key><string>$EXPORT_METHOD</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>compileBitcode</key><false/>
          <key>stripSwiftSymbols</key><true/>
          <key>thinning</key><string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/LibreBlock.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist
          mv build/export/LibreBlock.ipa "build/LibreBlock-${VERSION_TAG}.ipa"

      # ------------------------ unsigned build path ------------------------

      - name: Build app (unsigned)
        if: steps.signing.outputs.enabled == 'false'
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '1.0.0' }}
        run: |
          xcodebuild build \
            -project LibreBlock.xcodeproj \
            -scheme LibreBlock \
            -configuration Release \
            -destination generic/platform=iOS \
            MARKETING_VERSION="${VERSION#v}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA (unsigned)
        if: steps.signing.outputs.enabled == 'false'
        run: |
          mkdir -p Payload
          cp -R "build/Release-iphoneos/LibreBlock.app" Payload/
          SUFFIX="dev"
          [ "${{ github.ref_type }}" = "tag" ] && SUFFIX="${{ github.ref_name }}"
          zip -qr "build/LibreBlock-${SUFFIX}-unsigned.ipa" Payload

      # ------------------------------ publish ------------------------------

      - name: Upload IPA artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: LibreBlock-ipa
          path: build/*.ipa
          if-no-files-found: error

      - name: Release IPA
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.ipa
          generate_release_notes: true
          body: |
            LibreBlock ${{ github.ref_name }}

            **IPA**: download the file below and install it on your iPhone/iPad (iOS 16+).

            ${{ steps.signing.outputs.enabled == 'true'
              && 'This build is signed. Ad Hoc builds only run on devices registered in the provisioning profile; use the App Store method for TestFlight.'
              || '**This IPA is unsigned.** Install it with Sideloadly or AltStore, or re-sign it with your own Apple Developer certificate before installing.' }}
